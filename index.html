<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Nightshades Arbitrage Scanner</title>
<style>
:root{--bg:#0b0d12;--panel:#121722;--panel2:#181e2a;--line:#2a3447;--text:#f5f7fb;--muted:#94a0b4;--green:#39d27d;--red:#ff6575;--yellow:#f4c65c;--blue:#78a9ff;--gray:#aeb6c5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:980px;margin:auto;padding:18px 12px 60px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{font-size:22px;margin:0 0 5px;letter-spacing:-.02em}.sub,.small{font-size:11px;color:var(--muted)}
.buttons{display:flex;gap:7px;flex:none}button{border:1px solid var(--line);background:#171d28;color:var(--text);border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer;white-space:nowrap;min-width:54px}button.primary{background:#eef2f7;color:#090b0f}
.status,.decision,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.status{margin:12px 0;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:12px;min-height:46px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);flex:none}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.grow{flex:1}
.decision{padding:16px;margin-bottom:12px}.decision[data-state="go"]{border-color:#2d8e59}.decision[data-state="offer"]{border-color:#345f9d}.decision[data-state="wait"]{border-color:#80682e}.decision[data-state="stop"]{border-color:#7b3340}
.eyebrow{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.09em}
.decisionTitle{font-size:23px;font-weight:950;margin:6px 0 4px;letter-spacing:-.02em}.decisionSub{font-size:12px;color:var(--muted);line-height:1.55}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px}.kpi span{display:block;color:var(--muted);font-size:9px;margin-bottom:4px}.kpi b{font-size:14px}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.linkBtn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text);background:#171d28;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:10px;font-weight:850}.linkBtn.primaryLink{background:#edf2f7;color:#0a0d12;border-color:#edf2f7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{overflow:hidden}.head{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}.faction{font-size:18px;font-weight:900}.sym{font-size:10px;color:var(--muted);margin-left:6px}
.verdict{font-size:9px;font-weight:900;border:1px solid var(--line);border-radius:999px;padding:5px 7px;white-space:nowrap}.verdict.go{color:var(--green);border-color:#2d8e59}.verdict.offer{color:var(--blue);border-color:#345f9d}.verdict.wait{color:var(--yellow);border-color:#80682e}.verdict.none{color:var(--muted)}
.body{padding:11px}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.pill{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 6px;color:var(--muted)}.pill.dmg{color:var(--red)}.pill.win{color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px}.stat span{display:block;color:var(--muted);font-size:9px}.stat b{display:block;font-size:13px;margin-top:3px;white-space:nowrap}
.quick{margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#0f141d;font-size:11px;line-height:1.45}.quick strong{font-size:12px}
details.detailBox{margin-top:8px;border-top:1px solid var(--line);padding-top:7px}details.detailBox>summary{cursor:pointer;font-size:10px;color:var(--muted);font-weight:800}
.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.route,.offerBox{background:#0f141d;border:1px solid var(--line);border-radius:11px;padding:8px}.route.go{border-color:#2d8e59}.route.wait{border-color:#80682e}
.rtitle{font-size:10px;font-weight:900;margin-bottom:6px}.line{display:flex;justify-content:space-between;gap:7px;font-size:10px;color:var(--muted);padding:2px 0}.line b{color:var(--text)}.roi{font-size:17px;font-weight:900;margin-top:6px}
.offerBox{margin-top:8px}.offerGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.offerMetric{background:#131a25;border:1px solid var(--line);border-radius:9px;padding:7px}.offerMetric span{display:block;color:var(--muted);font-size:9px}.offerMetric b{display:block;font-size:13px;margin-top:3px}.offerHint{font-size:10px;color:var(--muted);line-height:1.45;margin-top:7px}
.green{color:var(--green)!important}.red{color:var(--red)!important}.yellow{color:var(--yellow)!important}.blue{color:var(--blue)!important}
.stopped{opacity:.45;pointer-events:none}
footer{font-size:10px;color:var(--muted);line-height:1.5;margin-top:14px}
dialog{width:min(720px,94vw);border:1px solid var(--line);border-radius:16px;background:#111620;color:var(--text);padding:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}label{font-size:10px;color:var(--muted)}input{width:100%;margin-top:4px;background:#0b0f16;color:var(--text);border:1px solid var(--line);padding:9px;border-radius:8px}pre{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;font-size:9px;color:#abb5c5}
@media(max-width:760px){.grid{grid-template-columns:1fr}.routes{grid-template-columns:1fr 1fr}.stats,.offerGrid{grid-template-columns:1fr 1fr}}
@media(max-width:430px){main{padding-top:14px}.top h1{font-size:20px}.buttons button{padding:8px 9px;min-width:50px}.kpis{grid-template-columns:1fr 1fr}.routes{grid-template-columns:1fr}.decisionTitle{font-size:21px}}
</style>
</head>
<body><main>
<div class="top">
 <div><h1>Nightshades Arbitrage Scanner</h1><div class="sub">今やるべきことを1つに絞って表示 · UI v3</div></div>
 <div class="buttons"><button id="settingsBtn">設定</button><button class="primary" id="refreshBtn">更新</button></div>
</div>

<div class="status"><span class="dot" id="dot"></span><b id="statusText">取得中</b><span class="small" id="statusDetail"></span><span class="grow"></span><span class="small" id="updated">—</span></div>

<section class="decision" id="decision" data-state="wait">
 <div class="eyebrow">NOW</div>
 <div class="decisionTitle" id="decisionTitle">判定中</div>
 <div class="decisionSub" id="decisionSub">最新データを取得しています。</div>
 <div class="kpis" id="decisionKpis">
  <div class="kpi"><span>①</span><b>—</b></div><div class="kpi"><span>②</span><b>—</b></div><div class="kpi"><span>③</span><b>—</b></div><div class="kpi"><span>④</span><b>—</b></div>
 </div>
 <div class="links" id="decisionLinks"></div>
</section>

<div class="grid" id="cards"></div>

<footer>
 判定優先順位は「即時裁定 → Collection Offer仕込み → 見送り」。データ取得失敗・OpenSeaデータが古い・The Night中・Sunrise Tax超過時は判定を停止します。
 Token売買額はスポット価格ベースの推定値のため、実行直前に実Quoteを確認してください。
</footer>
</main>

<dialog id="settingsDialog">
 <div style="display:flex;justify-content:space-between;align-items:center"><b>判定設定</b><button id="closeSettings">閉じる</button></div>
 <div class="form">
  <label>Creator Fee fallback %<input id="sellerFee" type="number" step="0.1"></label>
  <label>最低ROI %<input id="minRoi" type="number" step="1"></label>
  <label>最低利益 ETH<input id="minProfit" type="number" step="0.0005"></label>
  <label>許容Sunrise Tax %<input id="maxTax" type="number" step="0.5"></label>
  <label>OpenSea鮮度上限 分<input id="maxMarketAgeMin" type="number" step="5"></label>
  <label>Token→NFT 必要Token<input id="tokenToNftQty" type="number" step="1000"></label>
  <label>NFT→Token 受取Token<input id="nftToTokenQty" type="number" step="1000"></label>
  <label>プールFee %<input id="poolFee" type="number" step="0.1"></label>
  <label>Quote余裕 %<input id="quoteBuffer" type="number" step="0.5"></label>
  <label>Anvil/Network費 ETH<input id="anvilGas" type="number" step="0.00001"></label>
  <label>NFT売買予備費 ETH<input id="nftGas" type="number" step="0.00001"></label>
  <label>Offer上乗せ幅 ETH<input id="offerStep" type="number" step="0.0001"></label>
  <label>自動更新 秒<input id="refreshSec" type="number" step="5"></label>
 </div>
 <details><summary>診断データ</summary><pre id="diag">—</pre></details>
</dialog>

<script>
const MCP="https://laura.stonkbrokers.io/api/mcp";
const FACTIONS=[
 {id:"ghosts",name:"Ghosts",sym:"GHST"},
 {id:"watchers",name:"Watchers",sym:"WATCH"},
 {id:"knights",name:"Knights",sym:"KNGHT"},
 {id:"zombies",name:"Zombies",sym:"ZMBI"}
];
const DEFAULTS={
 sellerFee:6,minRoi:10,minProfit:0.002,maxTax:2,maxMarketAgeMin:20,
 tokenToNftQty:1105000,nftToTokenQty:895000,poolFee:1,quoteBuffer:1.5,
 anvilGas:0.00082,nftGas:0.0002,offerStep:0.0001,refreshSec:30
};
let cfg={...DEFAULTS,...JSON.parse(localStorage.getItem("nsScannerCfg")||"{}")},timer=null,lastRaw={};

const fmtEth=v=>Number.isFinite(v)?v.toFixed(4)+" Ξ":"—";
const fmtPct=v=>Number.isFinite(v)?(v*100).toFixed(1)+"%":"—";
const cls=v=>v>0?"green":v<0?"red":"";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function extractPayload(j){
 const r=j&&j.result;if(r&&r.structuredContent)return r.structuredContent;
 const t=r&&Array.isArray(r.content)&&r.content.find(x=>x&&x.text)?.text;
 if(t){try{return JSON.parse(t)}catch(e){}}
 return null;
}
async function fetchNightshadesOnce(timeoutMs=18000){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const res=await fetch(MCP,{method:"POST",headers:{"content-type":"application/json","accept":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:Date.now(),method:"tools/call",params:{name:"nightshades",arguments:{}}}),signal:controller.signal,cache:"no-store"});
  if(!res.ok)throw new Error("MCP HTTP "+res.status);
  const j=await res.json();if(j.error)throw new Error(j.error.message||"MCP error");
  const data=extractPayload(j);if(!data?.live?.factions)throw new Error("Nightshades liveデータ形式不一致");
  return {data,raw:j};
 }finally{clearTimeout(timeout)}
}
async function fetchNightshades(){
 let err=null;
 for(let i=0;i<2;i++){
  try{return await fetchNightshadesOnce(i===0?18000:25000)}
  catch(e){err=e;if(i===0)await sleep(700)}
 }
 throw err||new Error("Tokenデータ取得失敗");
}
async function fetchMarket(){
 const urls=[
  "https://raw.githubusercontent.com/Yuyayan/nightshades-arbitrage-scanner/main/floors.json?t="+Date.now(),
  "./floors.json?t="+Date.now()
 ];
 let lastError=null;
 for(const url of urls){
  try{const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw new Error("market HTTP "+res.status);return await res.json()}
  catch(e){lastError=e}
 }
 throw lastError||new Error("OpenSeaデータ取得失敗");
}
function quoteFromSpot(price,taxFraction){
 const overhead=cfg.poolFee/100+cfg.quoteBuffer/100+taxFraction;
 return {buy:cfg.tokenToNftQty*price*(1+overhead),sell:cfg.nftToTokenQty*price*Math.max(0,1-overhead)};
}
function offerGuide(tokenSell,topOffer,floor,fixedCost){
 const r=cfg.minRoi/100,maxByRoi=tokenSell/(1+r)-fixedCost,maxByProfit=tokenSell-fixedCost-cfg.minProfit;
 const maxOffer=Math.max(0,Math.min(maxByRoi,maxByProfit));
 let target=NaN;
 if(Number.isFinite(topOffer)&&maxOffer>topOffer)target=Math.min(maxOffer,topOffer+cfg.offerStep);
 else if(!Number.isFinite(topOffer)&&Number.isFinite(floor))target=Math.min(maxOffer,floor*.9);
 const totalCost=Number.isFinite(target)?target+fixedCost:NaN,profit=Number.isFinite(target)?tokenSell-totalCost:NaN,roi=Number.isFinite(target)&&totalCost>0?profit/totalCost:NaN;
 return {maxOffer,target,profit,roi,room:Number.isFinite(topOffer)?maxOffer-topOffer:NaN};
}
function calcRoute(f,liveRow,floor,topOffer,creatorFeeBps,globalLive){
 const price=Number(liveRow.priceEth),tax=Number(globalLive.snipeTaxBps||0)/10000,q=quoteFromSpot(price,tax);
 const blocked=!!globalLive.nightActive||tax>cfg.maxTax/100;
 const sellerFee=Number.isFinite(creatorFeeBps)?creatorFeeBps/10000:cfg.sellerFee/100;
 const tokenCost=q.buy+cfg.anvilGas;
 const floorReturn=floor*(1-sellerFee)-cfg.nftGas,offerReturn=topOffer*(1-sellerFee)-cfg.nftGas;
 const nftFloorCost=floor+cfg.nftGas+cfg.anvilGas,tokenReturn=q.sell;
 const guide=offerGuide(tokenReturn,topOffer,floor,cfg.nftGas+cfg.anvilGas);
 return {
  f,liveRow,floor,topOffer,creatorFeeBps,price,tax,q,blocked,sellerFee,guide,
  tokenToOffer:{cost:tokenCost,ret:offerReturn,profit:offerReturn-tokenCost,roi:(offerReturn-tokenCost)/tokenCost},
  tokenToFloor:{cost:tokenCost,ret:floorReturn,profit:floorReturn-tokenCost,roi:(floorReturn-tokenCost)/tokenCost},
  floorToToken:{cost:nftFloorCost,ret:tokenReturn,profit:tokenReturn-nftFloorCost,roi:(tokenReturn-nftFloorCost)/nftFloorCost}
 };
}
function isGo(r,blocked){return !blocked&&Number.isFinite(r.roi)&&r.roi>=cfg.minRoi/100&&r.profit>=cfg.minProfit}
function linksFor(x){
 const slug="nightshades-"+x.f.id,anvil=x.liveRow?.faction?.anvilMarket;
 return {openSea:"https://opensea.io/collection/"+slug,anvil:anvil?"https://anvil.clutch.market/market/"+anvil:"https://nightshades.meebco.com/anvil",token:"https://stonkbrokers.io/safe-launch/nightshades"};
}
function routeHtml(title,r,blocked,kind){
 const go=isGo(r,blocked),roiClass=blocked?"yellow":r.roi>=cfg.minRoi/100&&r.profit>0?"green":r.roi>=0?"yellow":"red";
 return `<div class="route ${go?"go":""} ${blocked?"wait":""}"><div class="rtitle">${title}</div><div class="line"><span>投入</span><b>${fmtEth(r.cost)}</b></div><div class="line"><span>回収</span><b>${fmtEth(r.ret)}</b></div><div class="line"><span>利益</span><b class="${cls(r.profit)}">${fmtEth(r.profit)}</b></div><div class="roi ${roiClass}">${blocked?"待機":fmtPct(r.roi)}</div><div class="small">${kind}</div></div>`;
}
function factionVerdict(x){
 const immediate=[
  {name:"Token→NFT→Top Offer",r:x.tokenToOffer},
  {name:"Floor購入→Token",r:x.floorToToken}
 ].sort((a,b)=>b.r.roi-a.r.roi)[0];
 if(x.blocked)return {kind:"wait",label:"待機",text:"Night / Tax条件で売買停止"};
 if(isGo(immediate.r,false))return {kind:"go",label:"即時GO",text:immediate.name+" · "+fmtPct(immediate.r.roi)};
 if(Number.isFinite(x.guide.target))return {kind:"offer",label:"Offer候補",text:"狙い "+fmtEth(x.guide.target)+" / 上限 "+fmtEth(x.guide.maxOffer)};
 return {kind:"none",label:"見送り",text:"現状は採算条件未達"};
}
function cardHtml(x){
 const v=factionVerdict(x),stateClass=x.liveRow.isDamaged?"dmg":"win",stateText=x.liveRow.isDamaged?"前回 Damage":"前回 Survivor",l=linksFor(x);
 return `<article class="card">
  <div class="head"><div><span class="faction">${x.f.name}</span><span class="sym">${x.f.sym}</span></div><span class="verdict ${v.kind}">${v.label}</span></div>
  <div class="body">
   <div class="meta"><span class="pill ${stateClass}">${stateText}</span><span class="pill">Tax ${(x.tax*100).toFixed(1)}%</span><span class="pill">Creator ${(x.sellerFee*100).toFixed(1)}%</span></div>
   <div class="stats">
    <div class="stat"><span>Floor</span><b>${fmtEth(x.floor)}</b></div>
    <div class="stat"><span>Top Offer</span><b>${fmtEth(x.topOffer)}</b></div>
    <div class="stat"><span>1.105M買い</span><b>${fmtEth(x.q.buy)}</b></div>
    <div class="stat"><span>895k売り</span><b>${fmtEth(x.q.sell)}</b></div>
   </div>
   <div class="quick"><strong class="${v.kind==="go"?"green":v.kind==="offer"?"blue":v.kind==="wait"?"yellow":""}">${v.text}</strong></div>
   <div class="links"><a class="linkBtn primaryLink" href="${l.openSea}" target="_blank" rel="noopener">OpenSea ↗</a><a class="linkBtn" href="${l.anvil}" target="_blank" rel="noopener">Anvil ↗</a><a class="linkBtn" href="${l.token}" target="_blank" rel="noopener">Token ↗</a></div>
   <details class="detailBox"><summary>詳細を見る</summary>
    <div class="routes">
     ${routeHtml("Token → NFT → Top Offer",x.tokenToOffer,x.blocked,"即時")}
     ${routeHtml("Token → NFT → Floor",x.tokenToFloor,x.blocked,"List待ち")}
     ${routeHtml("Floor購入 → Token",x.floorToToken,x.blocked,"即時")}
    </div>
    <div class="offerBox">
     <div class="offerGrid"><div class="offerMetric"><span>Top Offer</span><b>${fmtEth(x.topOffer)}</b></div><div class="offerMetric"><span>狙いOffer</span><b class="blue">${fmtEth(x.guide.target)}</b></div><div class="offerMetric"><span>採算上限</span><b>${fmtEth(x.guide.maxOffer)}</b></div><div class="offerMetric"><span>約定時ROI</span><b>${fmtPct(x.guide.roi)}</b></div></div>
     <div class="offerHint">「狙いOffer」は約定した場合に設定中の最低ROI・最低利益を維持する参考値です。Bot追随や未約定は考慮していません。</div>
    </div>
   </details>
  </div>
 </article>`;
}
function setDecision(state,title,sub,kpis=[],links=""){
 const box=document.getElementById("decision");box.dataset.state=state;
 document.getElementById("decisionTitle").textContent=title;
 document.getElementById("decisionTitle").className="decisionTitle "+(state==="go"?"green":state==="offer"?"blue":state==="wait"?"yellow":state==="stop"?"red":"");
 document.getElementById("decisionSub").textContent=sub;
 const cells=document.querySelectorAll("#decisionKpis .kpi");
 cells.forEach((c,i)=>{const d=kpis[i]||{label:"—",value:"—",className:""};c.querySelector("span").textContent=d.label;c.querySelector("b").textContent=d.value;c.querySelector("b").className=d.className||""});
 document.getElementById("decisionLinks").innerHTML=links||"";
}
function stopUi(reason,detail=""){
 setDecision("stop","⛔ 判定停止",reason+(detail?" / "+detail:""),[
  {label:"状態",value:"データ更新待ち",className:"red"},{label:"売買判断",value:"しない"},{label:"更新",value:"再試行"},{label:"安全側",value:"停止"}
 ],"");
 document.getElementById("cards").classList.add("stopped");
}
function render(rows,live,market){
 document.getElementById("cards").classList.remove("stopped");
 document.getElementById("cards").innerHTML=rows.map(cardHtml).join("");

 if(live.nightActive||Number(live.snipeTaxBps||0)/10000>cfg.maxTax/100){
  setDecision("wait","🟡 今は待機","The Night中、またはSunrise Taxが設定上限を超えています。",[
   {label:"Tax",value:((live.snipeTaxBps||0)/100).toFixed(1)+"%",className:"yellow"},{label:"行動",value:"待機"},{label:"Floor",value:"監視継続"},{label:"Offer",value:"監視継続"}
  ]);
  return;
 }

 const immediate=[];
 for(const x of rows){
  immediate.push({row:x,dir:"Token → NFT → Top Offer",...x.tokenToOffer});
  immediate.push({row:x,dir:"Floor購入 → Token",...x.floorToToken});
 }
 const go=immediate.filter(x=>isGo(x,x.row.blocked)).sort((a,b)=>b.profit-a.profit)[0];
 if(go){
  const l=linksFor(go.row);
  setDecision("go","🟢 今すぐ裁定あり · "+go.row.f.name,go.dir+" が設定条件を満たしています。実行前に実Quoteを確認してください。",[
   {label:"利益",value:"+"+go.profit.toFixed(4)+" Ξ",className:"green"},{label:"ROI",value:fmtPct(go.roi),className:"green"},{label:"投入",value:fmtEth(go.cost)},{label:"回収",value:fmtEth(go.ret)}
  ],'<a class="linkBtn primaryLink" href="'+(go.dir.startsWith("Floor")?l.openSea:l.token)+'" target="_blank" rel="noopener">確認 ↗</a><a class="linkBtn" href="'+l.anvil+'" target="_blank" rel="noopener">Anvil ↗</a>');
  return;
 }

 const offers=rows.filter(x=>Number.isFinite(x.guide.target)&&x.guide.roi>=cfg.minRoi/100&&x.guide.profit>=cfg.minProfit)
  .sort((a,b)=>b.guide.roi-a.guide.roi);
 const oc=offers[0];
 if(oc){
  const l=linksFor(oc);
  setDecision("offer","🔵 オファー仕込み候補 · "+oc.f.name,"即時裁定はありません。Collection Offerで安く拾えた場合のみ採算余地があります。Bot追随・未約定リスクあり。",[
   {label:"現在Top",value:fmtEth(oc.topOffer)},{label:"参考Offer",value:fmtEth(oc.guide.target),className:"blue"},{label:"採算上限",value:fmtEth(oc.guide.maxOffer)},{label:"約定時ROI",value:fmtPct(oc.guide.roi),className:"green"}
  ],'<a class="linkBtn primaryLink" href="'+l.openSea+'" target="_blank" rel="noopener">OpenSeaで確認 ↗</a><a class="linkBtn" href="'+l.anvil+'" target="_blank" rel="noopener">Anvil ↗</a>');
  return;
 }

 const best=immediate.filter(x=>Number.isFinite(x.roi)).sort((a,b)=>b.roi-a.roi)[0];
 setDecision("none","⚫ 今は何もしない",best?("一番近いのは "+best.row.f.name+" "+best.dir+" ですが、まだ採算条件未達です。"):"有効な裁定候補がありません。",[
  {label:"最高ROI",value:best?fmtPct(best.roi):"—",className:best&&best.roi<0?"red":""},{label:"最高利益",value:best?fmtEth(best.profit):"—",className:best&&best.profit<0?"red":""},{label:"最低ROI条件",value:cfg.minRoi.toFixed(0)+"%"},{label:"最低利益条件",value:cfg.minProfit.toFixed(3)+" Ξ"}
 ]);
}
async function refresh(){
 const btn=document.getElementById("refreshBtn");btn.disabled=true;
 document.getElementById("statusText").textContent="取得中";document.getElementById("statusDetail").textContent="";document.getElementById("dot").className="dot";
 try{
  const [nsResult,marketResult]=await Promise.allSettled([fetchNightshades(),fetchMarket()]);
  if(nsResult.status!=="fulfilled")throw new Error("Tokenライブ取得失敗: "+(nsResult.reason?.message||nsResult.reason));
  if(marketResult.status!=="fulfilled")throw new Error("OpenSea取得失敗: "+(marketResult.reason?.message||marketResult.reason));

  const ns=nsResult.value,live=ns.data.live,market=marketResult.value;
  const freshnessAt=market.checkedAt||market.updatedAt;
  const marketAge=freshnessAt?(Date.now()-Date.parse(freshnessAt))/60000:Infinity;
  if(!Number.isFinite(marketAge)||marketAge>cfg.maxMarketAgeMin){
   document.getElementById("dot").className="dot bad";
   document.getElementById("statusText").textContent="OpenSeaデータ古い";
   document.getElementById("statusDetail").textContent=Number.isFinite(marketAge)?marketAge.toFixed(0)+"分前":"更新時刻不明";
   stopUi("OpenSeaデータが古いため判定を止めています。","上限 "+cfg.maxMarketAgeMin+"分");
   document.getElementById("cards").innerHTML="";
   return;
  }

  const rows=FACTIONS.map(f=>{
   const liveRow=live.factions.find(x=>x?.faction?.id===f.id);if(!liveRow)throw new Error(f.name+" live data missing");
   const floor=Number(market?.floors?.[f.id]),offer=Number(market?.offers?.[f.id]),fee=Number(market?.creatorFeeBps?.[f.id]);
   return calcRoute(f,liveRow,Number.isFinite(floor)&&floor>0?floor:NaN,Number.isFinite(offer)&&offer>0?offer:NaN,Number.isFinite(fee)?fee:NaN,live);
  });
  const tokenCount=rows.filter(x=>Number.isFinite(x.price)).length,floorCount=rows.filter(x=>Number.isFinite(x.floor)).length,offerCount=rows.filter(x=>Number.isFinite(x.topOffer)).length;
  if(tokenCount!==4||floorCount!==4||offerCount!==4)throw new Error("データ不足 Token "+tokenCount+"/4 Floor "+floorCount+"/4 Offer "+offerCount+"/4");

  render(rows,live,market);
  document.getElementById("dot").className="dot ok";
  document.getElementById("statusText").textContent="正常 · Token 4/4 · Floor 4/4 · Offer 4/4";
  document.getElementById("statusDetail").textContent="Tax "+((live.snipeTaxBps||0)/100).toFixed(1)+"% · OpenSea "+Math.max(0,marketAge).toFixed(1)+"分前";
  document.getElementById("updated").textContent=new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  lastRaw={rows:rows.map(x=>({faction:x.f.id,price:x.price,floor:x.floor,offer:x.topOffer,targetOffer:x.guide.target,maxOffer:x.guide.maxOffer})),live,market,marketAge};
  document.getElementById("diag").textContent=JSON.stringify(lastRaw,null,2);
 }catch(e){
  const msg=String(e.message||e);
  document.getElementById("dot").className="dot bad";document.getElementById("statusText").textContent="取得失敗";document.getElementById("statusDetail").textContent=msg;
  document.getElementById("cards").innerHTML="";
  stopUi("最新データを取得できませんでした。","「更新」で再試行してください");
  document.getElementById("diag").textContent=String(e.stack||e);
 }finally{
  document.getElementById("updated").textContent=new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  btn.disabled=false;
 }
}
function saveCfg(){localStorage.setItem("nsScannerCfg",JSON.stringify(cfg))}
const configIds=["sellerFee","minRoi","minProfit","maxTax","maxMarketAgeMin","tokenToNftQty","nftToTokenQty","poolFee","quoteBuffer","anvilGas","nftGas","offerStep","refreshSec"];
for(const id of configIds){const el=document.getElementById(id);el.value=cfg[id];el.addEventListener("change",()=>{cfg[id]=Number(el.value);saveCfg();startTimer();refresh()})}
function startTimer(){clearInterval(timer);timer=setInterval(refresh,Math.max(10,cfg.refreshSec)*1000)}
document.getElementById("settingsBtn").onclick=()=>document.getElementById("settingsDialog").showModal();
document.getElementById("closeSettings").onclick=()=>document.getElementById("settingsDialog").close();
document.getElementById("refreshBtn").onclick=refresh;
startTimer();refresh();
</script>
