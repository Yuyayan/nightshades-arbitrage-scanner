<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Nightshades Arbitrage Scanner</title>
<style>
:root{--bg:#0b0d12;--panel:#121722;--panel2:#181e2a;--line:#2a3447;--text:#f5f7fb;--muted:#94a0b4;--green:#39d27d;--red:#ff6575;--yellow:#f4c65c;--blue:#78a9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:980px;margin:auto;padding:18px 12px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{font-size:22px;margin:0 0 5px;letter-spacing:-.02em}.sub,.small{font-size:11px;color:var(--muted)}
.buttons{display:flex;gap:7px}button{border:1px solid var(--line);background:#171d28;color:var(--text);border-radius:10px;padding:9px 11px;font-weight:800}button.primary{background:#eef2f7;color:#090b0f}
.status,.best,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}.status{margin:12px 0;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--yellow)}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.grow{flex:1}
.best{padding:14px;margin-bottom:12px}.eyebrow{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.09em}.bestName{font-size:20px;font-weight:900;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px}.kpi span{display:block;color:var(--muted);font-size:9px;margin-bottom:4px}.kpi b{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{overflow:hidden}.head{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.faction{font-size:18px;font-weight:900}.sym{font-size:10px;color:var(--muted);margin-left:6px}
.body{padding:11px}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.pill{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 6px;color:var(--muted)}.pill.dmg{color:var(--red)}.pill.win{color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat,.route{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px}.stat span{display:block;color:var(--muted);font-size:9px}.stat b{display:block;font-size:13px;margin-top:3px;white-space:nowrap}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.route{background:#0f141d}.route.go{border-color:#2d8e59;box-shadow:inset 0 0 0 1px rgba(57,210,125,.05)}.route.wait{border-color:#8a7030}
.rtitle{font-size:10px;font-weight:900;margin-bottom:6px}.line{display:flex;justify-content:space-between;gap:7px;font-size:10px;color:var(--muted);padding:2px 0}.line b{color:var(--text)}.roi{font-size:18px;font-weight:900;margin-top:6px}.green{color:var(--green)!important}.red{color:var(--red)!important}.yellow{color:var(--yellow)!important}
.notice{font-size:10px;color:var(--muted);line-height:1.5;margin-top:8px}footer{font-size:10px;color:var(--muted);line-height:1.5;margin-top:14px}
dialog{width:min(700px,94vw);border:1px solid var(--line);border-radius:16px;background:#111620;color:var(--text);padding:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}label{font-size:10px;color:var(--muted)}input{width:100%;margin-top:4px;background:#0b0f16;color:var(--text);border:1px solid var(--line);padding:9px;border-radius:8px}
details{margin-top:12px}pre{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;font-size:9px;color:#abb5c5}
@media(max-width:700px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}@media(max-width:430px){.routes{grid-template-columns:1fr}.top h1{font-size:20px}}
</style>
</head>
<body><main>
<div class="top">
 <div><h1>Nightshades Arbitrage Scanner</h1><div class="sub">4陣営 × Token→NFT / NFT→Token を自動比較</div></div>
 <div class="buttons"><button id="settingsBtn">設定</button><button class="primary" id="refreshBtn">更新</button></div>
</div>
<div class="status"><span class="dot" id="dot"></span><b id="statusText">取得中</b><span class="small" id="statusDetail"></span><span class="grow"></span><span class="small" id="updated">—</span></div>
<section class="best">
 <div class="eyebrow">BEST OPPORTUNITY</div><div class="bestName" id="bestName">判定待ち</div>
 <div class="kpis">
  <div class="kpi"><span>想定利益</span><b id="bestProfit">—</b></div>
  <div class="kpi"><span>ROI</span><b id="bestRoi">—</b></div>
  <div class="kpi"><span>投入</span><b id="bestCost">—</b></div>
  <div class="kpi"><span>回収</span><b id="bestReturn">—</b></div>
 </div>
 <div class="notice" id="bestNote"></div>
</section>
<div class="grid" id="cards"></div>
<footer>
 Token価格・Sunrise TaxはStonkBrokersのNightshadesライブデータ、NFT FloorはOpenSea公開ページを5分間隔で収集。
 Token売買額はスポット価格から1%プールFee・Sunrise Tax・設定バッファを控除/加算した保守的な推定です。実際の約定額は発注直前に確認してください。
</footer>
</main>

<dialog id="settingsDialog">
 <div style="display:flex;justify-content:space-between;align-items:center"><b>判定設定</b><button id="closeSettings">閉じる</button></div>
 <div class="form">
  <label>OpenSea売却控除率 %<input id="sellerFee" type="number" step="0.1"></label>
  <label>最低ROI %<input id="minRoi" type="number" step="1"></label>
  <label>最低利益 ETH<input id="minProfit" type="number" step="0.0005"></label>
  <label>許容Sunrise Tax %<input id="maxTax" type="number" step="0.5"></label>
  <label>Token→NFT 必要Token<input id="tokenToNftQty" type="number" step="1000"></label>
  <label>NFT→Token 受取Token<input id="nftToTokenQty" type="number" step="1000"></label>
  <label>プールFee %<input id="poolFee" type="number" step="0.1"></label>
  <label>Quote余裕 %<input id="quoteBuffer" type="number" step="0.5"></label>
  <label>Anvil/Network費 ETH<input id="anvilGas" type="number" step="0.00001"></label>
  <label>NFT売買予備費 ETH<input id="nftGas" type="number" step="0.00001"></label>
  <label>自動更新 秒<input id="refreshSec" type="number" step="5"></label>
 </div>
 <details><summary>診断データ</summary><pre id="diag">—</pre></details>
</dialog>

<script>
const MCP = "https://laura.stonkbrokers.io/api/mcp";
const FACTIONS = [
 {id:"ghosts",name:"Ghosts",sym:"GHST"},
 {id:"watchers",name:"Watchers",sym:"WATCH"},
 {id:"knights",name:"Knights",sym:"KNGHT"},
 {id:"zombies",name:"Zombies",sym:"ZMBI"}
];
const DEFAULTS = {
 sellerFee:6, minRoi:10, minProfit:0.002, maxTax:2,
 tokenToNftQty:1105000, nftToTokenQty:895000,
 poolFee:1, quoteBuffer:1.5, anvilGas:0.00082, nftGas:0.0002, refreshSec:30
};
let cfg = {...DEFAULTS, ...JSON.parse(localStorage.getItem("nsScannerCfg") || "{}")};
let timer = null, lastRaw = {};

const fmtEth = v => Number.isFinite(v) ? v.toFixed(4) + " Ξ" : "—";
const fmtPct = v => Number.isFinite(v) ? (v*100).toFixed(1) + "%" : "—";
const cls = v => v > 0 ? "green" : v < 0 ? "red" : "";

function extractPayload(j){
 const r = j && j.result;
 if (r && r.structuredContent) return r.structuredContent;
 const text = r && Array.isArray(r.content) && r.content.find(x => x && x.text)?.text;
 if (text) { try { return JSON.parse(text); } catch(e) {} }
 return null;
}
async function fetchNightshades(){
 const controller = new AbortController();
 const timeout = setTimeout(() => controller.abort(), 10000);
 try{
  const res = await fetch(MCP, {
   method:"POST",
   headers:{"content-type":"application/json","accept":"application/json"},
   body:JSON.stringify({jsonrpc:"2.0",id:Date.now(),method:"tools/call",params:{name:"nightshades",arguments:{}}}),
   signal:controller.signal,
   cache:"no-store"
  });
  if(!res.ok) throw new Error("MCP HTTP " + res.status);
  const j = await res.json();
  if(j.error) throw new Error(j.error.message || "MCP error");
  const data = extractPayload(j);
  if(!data?.live?.factions) throw new Error("Nightshades liveデータ形式不一致");
  return {data, raw:j};
 } finally { clearTimeout(timeout); }
}
async function fetchFloors(){
 const res = await fetch("./floors.json?t=" + Date.now(), {cache:"no-store"});
 if(!res.ok) throw new Error("floors.json HTTP " + res.status);
 const j = await res.json();
 return j;
}
function quoteFromSpot(price, taxFraction){
 const buyOverhead = cfg.poolFee/100 + cfg.quoteBuffer/100 + taxFraction;
 const sellOverhead = cfg.poolFee/100 + cfg.quoteBuffer/100 + taxFraction;
 return {
  buy: cfg.tokenToNftQty * price * (1 + buyOverhead),
  sell: cfg.nftToTokenQty * price * Math.max(0, 1 - sellOverhead)
 };
}
function calcRoute(f, liveRow, floor, globalLive){
 const price = Number(liveRow.priceEth);
 const tax = Number(globalLive.snipeTaxBps || 0) / 10000;
 const q = quoteFromSpot(price, tax);
 const blocked = !!globalLive.nightActive || tax > cfg.maxTax/100;
 const tCost = q.buy + cfg.anvilGas;
 const tReturn = floor * (1 - cfg.sellerFee/100) - cfg.nftGas;
 const tProfit = tReturn - tCost;
 const nCost = floor + cfg.nftGas + cfg.anvilGas;
 const nReturn = q.sell;
 const nProfit = nReturn - nCost;
 return {
  f, liveRow, floor, price, tax, blocked, q,
  tokenToNft:{cost:tCost,ret:tReturn,profit:tProfit,roi:tProfit/tCost},
  nftToToken:{cost:nCost,ret:nReturn,profit:nProfit,roi:nProfit/nCost}
 };
}
function isGo(r, blocked){
 return !blocked && Number.isFinite(r.roi) && r.roi >= cfg.minRoi/100 && r.profit >= cfg.minProfit;
}
function routeHtml(title,r,blocked){
 const go = isGo(r,blocked);
 const wait = blocked;
 const roiClass = wait ? "yellow" : r.roi >= cfg.minRoi/100 && r.profit > 0 ? "green" : r.roi >= 0 ? "yellow" : "red";
 return `<div class="route ${go?"go":""} ${wait?"wait":""}">
   <div class="rtitle">${title}</div>
   <div class="line"><span>投入</span><b>${fmtEth(r.cost)}</b></div>
   <div class="line"><span>回収</span><b>${fmtEth(r.ret)}</b></div>
   <div class="line"><span>利益</span><b class="${cls(r.profit)}">${fmtEth(r.profit)}</b></div>
   <div class="roi ${roiClass}">${wait?"待機":fmtPct(r.roi)}</div>
  </div>`;
}
function cardHtml(x){
 const stateClass = x.liveRow.isDamaged ? "dmg" : "win";
 const stateText = x.liveRow.isDamaged ? "前回 Damage" : "前回 Survivor";
 const taxText = "Tax " + (x.tax*100).toFixed(1) + "%";
 return `<article class="card">
  <div class="head"><div><span class="faction">${x.f.name}</span><span class="sym">${x.f.sym}</span></div><span class="pill">${taxText}</span></div>
  <div class="body">
   <div class="meta"><span class="pill ${stateClass}">${stateText}</span><span class="pill">Token ${x.price.toExponential(3)} ETH</span></div>
   <div class="stats">
    <div class="stat"><span>NFT Floor</span><b>${fmtEth(x.floor)}</b></div>
    <div class="stat"><span>1.105M買い推定</span><b>${fmtEth(x.q.buy)}</b></div>
    <div class="stat"><span>895k売り推定</span><b>${fmtEth(x.q.sell)}</b></div>
   </div>
   <div class="routes">
    ${routeHtml("Token → NFT → 売却",x.tokenToNft,x.blocked)}
    ${routeHtml("NFT → Token → 売却",x.nftToToken,x.blocked)}
   </div>
  </div>
 </article>`;
}
function render(rows, live, floors){
 document.getElementById("cards").innerHTML = rows.map(cardHtml).join("");
 const routes = [];
 for(const x of rows){
  routes.push({f:x.f,dir:"Token → NFT",blocked:x.blocked,...x.tokenToNft});
  routes.push({f:x.f,dir:"NFT → Token",blocked:x.blocked,...x.nftToToken});
 }
 const usable = routes.filter(x => !x.blocked && Number.isFinite(x.roi)).sort((a,b) => b.roi-a.roi);
 const best = usable[0];
 const bestName = document.getElementById("bestName");
 if(!best){
  bestName.textContent = live.nightActive ? "The Night中：待機" : "判定材料不足";
  ["bestProfit","bestRoi","bestCost","bestReturn"].forEach(id=>document.getElementById(id).textContent="—");
 } else {
  const good = isGo(best,false);
  bestName.textContent = (good ? "GO · " : "見送り · ") + best.f.name + " " + best.dir;
  bestName.className = "bestName " + (good ? "green" : best.roi >= 0 ? "yellow" : "red");
  document.getElementById("bestProfit").textContent=fmtEth(best.profit);
  document.getElementById("bestProfit").className=cls(best.profit);
  document.getElementById("bestRoi").textContent=fmtPct(best.roi);
  document.getElementById("bestRoi").className=best.roi>=cfg.minRoi/100?"green":best.roi>=0?"yellow":"red";
  document.getElementById("bestCost").textContent=fmtEth(best.cost);
  document.getElementById("bestReturn").textContent=fmtEth(best.ret);
 }
 const ageMin = floors.updatedAt ? (Date.now()-Date.parse(floors.updatedAt))/60000 : NaN;
 document.getElementById("bestNote").textContent =
   "OpenSea Floor更新: " + (Number.isFinite(ageMin) ? Math.max(0,ageMin).toFixed(1)+"分前" : "不明") +
   " / 次Night: " + (live.nextNightAt ? new Date(live.nextNightAt).toLocaleString("ja-JP") : "—");
}
async function refresh(){
 const btn=document.getElementById("refreshBtn");
 btn.disabled=true; document.getElementById("statusText").textContent="取得中"; document.getElementById("dot").className="dot";
 try{
  const [nsResult, floorResult] = await Promise.allSettled([fetchNightshades(), fetchFloors()]);
  if(nsResult.status!=="fulfilled") throw nsResult.reason;
  const ns = nsResult.value;
  const live = ns.data.live;
  let floors = {floors:{}, updatedAt:null, complete:0};
  let floorError = null;
  if(floorResult.status==="fulfilled") floors=floorResult.value;
  else floorError=String(floorResult.reason?.message || floorResult.reason);

  const rows = FACTIONS.map(f=>{
   const liveRow = live.factions.find(x=>x?.faction?.id===f.id);
   const floor = Number(floors?.floors?.[f.id]);
   if(!liveRow) throw new Error(f.name+" live data missing");
   return calcRoute(f,liveRow,Number.isFinite(floor)&&floor>0?floor:NaN,live);
  });
  render(rows,live,floors);
  const tokenCount=rows.filter(x=>Number.isFinite(x.price)).length;
  const floorCount=rows.filter(x=>Number.isFinite(x.floor)).length;
  document.getElementById("dot").className = "dot " + (tokenCount===4 && floorCount===4 ? "ok" : "");
  document.getElementById("statusText").textContent = "Token " + tokenCount + "/4 · Floor " + floorCount + "/4";
  document.getElementById("statusDetail").textContent =
   "Tax " + ((live.snipeTaxBps||0)/100).toFixed(1) + "%" + (floorError ? " · Floor取得待ち" : "");
  document.getElementById("updated").textContent = new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  lastRaw={parsed:rows.map(x=>({faction:x.f.id,priceEth:x.price,floor:x.floor,buyEstimate:x.q.buy,sellEstimate:x.q.sell,tax:x.tax})),live,floors,floorError};
  document.getElementById("diag").textContent=JSON.stringify(lastRaw,null,2);
 } catch(e){
  document.getElementById("dot").className="dot bad";
  document.getElementById("statusText").textContent="取得エラー";
  document.getElementById("statusDetail").textContent=String(e.message||e);
  document.getElementById("diag").textContent=String(e.stack||e);
 } finally { btn.disabled=false; }
}
function saveCfg(){localStorage.setItem("nsScannerCfg",JSON.stringify(cfg))}
const configIds=["sellerFee","minRoi","minProfit","maxTax","tokenToNftQty","nftToTokenQty","poolFee","quoteBuffer","anvilGas","nftGas","refreshSec"];
for(const id of configIds){
 const el=document.getElementById(id); el.value=cfg[id];
 el.addEventListener("change",()=>{cfg[id]=Number(el.value);saveCfg();startTimer();refresh()});
}
function startTimer(){clearInterval(timer);timer=setInterval(refresh,Math.max(10,cfg.refreshSec)*1000)}
document.getElementById("settingsBtn").onclick=()=>document.getElementById("settingsDialog").showModal();
document.getElementById("closeSettings").onclick=()=>document.getElementById("settingsDialog").close();
document.getElementById("refreshBtn").onclick=refresh;
startTimer(); refresh();
</script>
</body></html>
