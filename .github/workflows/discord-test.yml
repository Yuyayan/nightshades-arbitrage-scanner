name: Discord webhook test

on:
  push:
    paths:
      - ".github/workflows/discord-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url=os.environ.get("DISCORD_WEBHOOK_URL","").strip()
          if not url:
              raise SystemExit("DISCORD_WEBHOOK_URL is empty")
          body=json.dumps({
              "content":"✅ **Nightshades Discord通知 接続OK**\nWebhookの登録を確認しました。今後、条件を満たす裁定チャンスが出たときに通知します。"
          }).encode()
          req=urllib.request.Request(url,data=body,headers={"content-type":"application/json","user-agent":"Nightshades-Scanner/1.0"},method="POST")
          with urllib.request.urlopen(req,timeout=20) as r:
              print("status",r.status)
          PY
