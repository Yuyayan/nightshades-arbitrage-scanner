name: Probe OpenSea Page CORS
on:
  push:
    paths:
      - ".github/workflows/probe-mcp.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          {
            echo "=== HTML headers ==="
            curl -i -sS --max-time 20 -H 'Origin: https://yuyayan.github.io' 'https://opensea.io/collection/nightshades-ghosts' | head -50
          } > probe-page-cors.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-page-cors.txt
          git commit -m "Probe OpenSea collection page CORS" || exit 0
          git push
