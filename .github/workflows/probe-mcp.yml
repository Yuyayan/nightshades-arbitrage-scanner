name: Probe Nightshades Resource
on:
  push:
    paths:
      - ".github/workflows/probe-mcp.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          curl -sS --max-time 30 'https://laura.stonkbrokers.io/api/mcp' \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":9,"method":"resources/read","params":{"uri":"laura://nightshades"}}' > probe-resource.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-resource.txt
          git commit -m "Probe Nightshades resource" || exit 0
          git push
