name: Probe Market APIs
on:
  push:
    paths:
      - ".github/workflows/probe-mcp.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe OpenSea and public pages
        run: |
          set +e
          for slug in nightshades-ghosts nightshades-watchers nightshades-knights nightshades-zombies; do
            echo "=== $slug V2 stats ===" > "probe-$slug.txt"
            curl -i -sS --max-time 20 "https://api.opensea.io/api/v2/collections/$slug/stats" >> "probe-$slug.txt"
            echo "\n=== page grep ===" >> "probe-$slug.txt"
            curl -sS --max-time 20 "https://opensea.io/collection/$slug" | head -c 200000 | grep -Eo '.{0,100}(floor|floorPrice|floor_price).{0,160}' | head -20 >> "probe-$slug.txt"
          done
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-nightshades-*.txt
          git commit -m "Probe OpenSea Nightshades floor endpoints" || exit 0
          git push
