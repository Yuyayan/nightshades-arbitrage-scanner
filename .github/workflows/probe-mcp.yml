name: Probe CORS
on:
  push:
    paths:
      - ".github/workflows/probe-mcp.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe CORS
        run: |
          set +e
          {
            echo "=== OpenSea ==="
            curl -i -sS --max-time 20 -H 'Origin: https://yuyayan.github.io' 'https://api.opensea.io/api/v2/collections/nightshades-ghosts/stats' | head -60
            echo "=== MCP ==="
            curl -i -sS --max-time 20 -H 'Origin: https://yuyayan.github.io' -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"nightshades","arguments":{}}}' \
              'https://laura.stonkbrokers.io/api/mcp' | head -60
          } > probe-cors.txt
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-cors.txt
          git commit -m "Probe CORS headers" || exit 0
          git push
