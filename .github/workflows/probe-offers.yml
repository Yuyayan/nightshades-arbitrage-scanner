name: Probe OpenSea offers
on:
  push:
    paths:
      - ".github/workflows/probe-offers.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe offers
        run: |
          set +e
          for slug in nightshades-ghosts nightshades-watchers nightshades-knights nightshades-zombies; do
            echo "=== $slug API ===" > "offer-$slug.txt"
            curl -i -sS --max-time 20 "https://api.opensea.io/api/v2/offers/collection/$slug?limit=20" >> "offer-$slug.txt"
            echo "\n=== PAGE MATCHES ===" >> "offer-$slug.txt"
            curl -sS --max-time 20 "https://opensea.io/collection/$slug" | \
              grep -Eo '.{0,180}(topOffer|bestOffer|collectionOffer|offerPrice|highestOffer|best_offer|top_offer|offer_price).{0,300}' | head -80 >> "offer-$slug.txt"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offer-*.txt
          git commit -m "Probe OpenSea collection offers" || exit 0
          git push
